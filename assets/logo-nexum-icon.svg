<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBlueGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#006596"/>
      <stop offset="100%" stop-color="#028ac8"/>
    </linearGradient>
    <linearGradient id="iconNavyGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0a1d33"/>
      <stop offset="100%" stop-color="#0f2b4c"/>
    </linearGradient>
  </defs>

  <!-- Centrado y encuadrado exacto con márgenes de seguridad para foto de perfil / app icon -->
  <g transform="translate(48, 55) scale(1.35)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trazo 1: Navy -->
    <path d="M 45 230 L 120 70 L 180 200 L 235 85" 
          fill="none" 
          stroke="url(#iconNavyGrad)" 
          stroke-width="32"/>
    <!-- Flecha 1 -->
    <polygon points="235,55 208,98 263,88" fill="#0f2b4c"/>

    <!-- Trazo 2: Cyan/Blue entrelazado -->
    <path d="M 95 230 L 160 95 L 220 220 L 285 55" 
          fill="none" 
          stroke="url(#iconBlueGrad)" 
          stroke-width="32"/>
    <!-- Flecha 2 -->
    <polygon points="285,25 258,68 313,58" fill="#028ac8"/>
  </g>
</svg>
