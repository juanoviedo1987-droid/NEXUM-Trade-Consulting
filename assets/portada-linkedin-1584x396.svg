<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Fondo corporativo degradé profundo idéntico al Brand Kit -->
    <linearGradient id="bgGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0b1e36"/>
      <stop offset="100%" stop-color="#002529"/>
    </linearGradient>

    <!-- Gradiente para el trazo celeste luminoso -->
    <linearGradient id="cyanGradRight" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Resplandor sutil en la zona central-derecha -->
    <radialGradient id="glowRight" cx="72%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- FONDO 1584x396 -->
  <rect width="1584" height="396" fill="url(#bgGradRight)"/>
  <rect width="1584" height="396" fill="url(#glowRight)"/>

  <!-- DETALLES SUTILES DECORATIVOS -->
  <g opacity="0.10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8">
    <line x1="0" y1="50" x2="1584" y2="50" />
    <line x1="0" y1="346" x2="1584" y2="346" />
    <circle cx="1500" cy="50" r="5" fill="#38bdf8"/>
    <circle cx="80" cy="346" r="5" fill="#38bdf8"/>
  </g>

  <!-- BLOQUE COMPLETO DESPLAZADO A LA IZQUIERDA (X: 490) PARA DEJAR 360PX DE MARGEN DERECHO LIBRE -->
  <g transform="translate(490, 75)">
    
    <!-- ISOTIPO: N entrelazada Dark Mode -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Trazo 1: Blanco Puro -->
      <path d="M 50 200 L 125 55 L 185 175 L 240 70" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="28"/>
      <polygon points="240,42 215,80 265,72" fill="#ffffff"/>

      <!-- Trazo 2: Celeste Eléctrico Luminoso -->
      <path d="M 95 200 L 160 78 L 220 195 L 285 45" 
            fill="none" 
            stroke="url(#cyanGradRight)" 
            stroke-width="28"/>
      <polygon points="285,18 260,56 310,48" fill="#38bdf8"/>
    </g>

    <!-- TIPOGRAFÍA ORIGINAL DEL LOGO DARK -->
    <!-- NEXUM -->
    <text x="350" y="132" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="108" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="#ffffff">NEXUM</text>
    
    <!-- TRADE CONSULTING -->
    <text x="354" y="186" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="28" 
          font-weight="600" 
          letter-spacing="0.32em" 
          fill="#38bdf8">TRADE CONSULTING</text>

    <!-- SUBTÍTULO ALINEADO EXACTAMENTE AL ANCHO DE TRADE CONSULTING -->
    <text x="354" y="235" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="500" 
          letter-spacing="0.05em" 
          fill="#94a3b8">CONSULTORÍA ESTRATÉGICA EN COMERCIO EXTERIOR</text>
  </g>

</svg>
