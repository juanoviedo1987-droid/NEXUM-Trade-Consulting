<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el trazo cian/celeste eléctrico -->
    <linearGradient id="cyanGradLight" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <g transform="translate(15, 10)">
    <!-- ISOTIPO: N entrelazada adaptada para modo oscuro -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Trazo 1: Blanco puro / hielo para que resalte con contraste absoluto -->
      <path d="M 50 200 L 125 55 L 185 175 L 240 70" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="28"/>
      <!-- Punta Flecha 1 (Blanca) -->
      <polygon points="240,42 215,80 265,72" fill="#ffffff"/>

      <!-- Trazo 2: Celeste eléctrico luminoso -->
      <path d="M 95 200 L 160 78 L 220 195 L 285 45" 
            fill="none" 
            stroke="url(#cyanGradLight)" 
            stroke-width="28"/>
      <!-- Punta Flecha 2 (Celeste luminoso) -->
      <polygon points="285,18 260,56 310,48" fill="#38bdf8"/>
    </g>

    <!-- TIPOGRAFÍA MODO OSCURO -->
    <!-- NEXUM en blanco brillante -->
    <text x="350" y="132" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="108" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="#ffffff">NEXUM</text>
    
    <!-- TRADE CONSULTING en celeste luminoso -->
    <text x="354" y="186" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="28" 
          font-weight="600" 
          letter-spacing="0.32em" 
          fill="#38bdf8">TRADE CONSULTING</text>
  </g>
</svg>
