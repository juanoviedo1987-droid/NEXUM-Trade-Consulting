<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descarga Oficial Portada LinkedIn 1584x396 — Nexum Trade Consulting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 flex flex-col items-center justify-center p-6">

  <div class="max-w-4xl text-center space-y-3 mb-6">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-400/20 text-sky-400 text-xs font-bold uppercase tracking-wider font-mono">
      <span>🛡️</span> Portada Oficial LinkedIn 1584 x 396 px
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Nexum Trade Consulting</h1>
    <p class="text-sm text-slate-400">Adaptación 1:1 exacta de la portada oficial de WhatsApp Business a las medidas exigidas por LinkedIn.</p>
    
    <div class="pt-2 flex items-center justify-center gap-4">
      <button onclick="descargarPNG()" class="px-6 py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm rounded-xl transition shadow-lg shadow-sky-500/20 flex items-center gap-2 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Descargar Portada en PNG (1584 x 396)
      </button>

      <a href="assets/portada-linkedin-1584x396.svg" download class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm rounded-xl border border-slate-700 transition flex items-center gap-2">
        Descargar SVG Vector
      </a>
    </div>
  </div>

  <!-- Vista previa de la portada -->
  <div class="w-full max-w-5xl overflow-hidden rounded-2xl border border-slate-800 shadow-2xl bg-black">
    <img id="previewSVG" src="assets/portada-linkedin-1584x396.svg" alt="Portada LinkedIn 1584x396" class="w-full h-auto object-contain">
  </div>

  <canvas id="exportCanvas" width="1584" height="396" style="display: none;"></canvas>

  <script>
    function descargarPNG() {
      const svgImg = document.getElementById('previewSVG');
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        ctx.clearRect(0, 0, 1584, 396);
        ctx.drawImage(img, 0, 0, 1584, 396);
        
        const link = document.createElement('a');
        link.download = 'portada-linkedin-nexum-1584x396.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = svgImg.src;
    }
  </script>

</body>
</html>
